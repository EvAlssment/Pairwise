services:
  edge:
    image: nginx:1.28.0-alpine
    volumes:
      - ./generated/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./generated/certificates:/etc/letsencrypt:ro
      - ./generated/challenges:/var/www/certbot:ro
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
    restart: unless-stopped
    depends_on: [api, livekit]
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: ['--config', '/etc/livekit.yaml']
    volumes:
      - ./generated/livekit.yaml:/etc/livekit.yaml:ro
      - ./generated/certificates:/etc/letsencrypt:ro
    ports:
      - '7881:7881/tcp'
      - '50000-50100:50000-50100/udp'
      - '3478:3478/udp'
    restart: unless-stopped
  api:
    build:
      context: ../../server
      args:
        PAIRDESK_BUILD_COMMIT: ${PAIRDESK_BUILD_COMMIT:-unknown}
    environment:
      PAIRDESK_ADDR: '0.0.0.0:8080'
      PAIRDESK_DATA: /data/pairdesk.json
      PAIRDESK_SIGNUP_ENABLED: ${PAIRDESK_SIGNUP_ENABLED:-true}
      PAIRDESK_SIGNUP_ALLOWED_DOMAINS: ${PAIRDESK_SIGNUP_ALLOWED_DOMAINS:-}
      PAIRDESK_ACCESS_ALLOWED_DOMAINS: ${PAIRDESK_ACCESS_ALLOWED_DOMAINS:-}
      PAIRDESK_ACCESS_ALLOWED_EMAILS: ${PAIRDESK_ACCESS_ALLOWED_EMAILS:-}
      PAIRDESK_SIGNUP_VERIFY_EMAIL: ${PAIRDESK_SIGNUP_VERIFY_EMAIL:-true}
      PAIRDESK_RESEND_FROM: ${PAIRDESK_RESEND_FROM:-}
      PAIRDESK_RESEND_API_KEY_FILE: /run/secrets/pairdesk-resend-key
      # Set to a private Cloud SQL PostgreSQL DSN before running more than one
      # API replica. Empty keeps the existing single-writer JSON-volume mode.
      PAIRDESK_DATABASE_URL: ${PAIRDESK_DATABASE_URL:-}
      LIVEKIT_URL: wss://${MEDIA_DOMAIN:?run configure.py}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run configure.py}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run configure.py}
      PAIRDESK_APNS_TEAM_ID: ${PAIRDESK_APNS_TEAM_ID:-}
      PAIRDESK_APNS_KEY_ID: ${PAIRDESK_APNS_KEY_ID:-}
      PAIRDESK_APNS_TOPIC: ${PAIRDESK_APNS_TOPIC:-}
      PAIRDESK_APNS_PRIVATE_KEY_FILE: /run/secrets/pairdesk-apns-auth-key
      PAIRDESK_APNS_HOST: ${PAIRDESK_APNS_HOST:-https://api.push.apple.com}
      PAIRDESK_FCM_PROJECT_ID: ${PAIRDESK_FCM_PROJECT_ID:-}
      PAIRDESK_FCM_SERVICE_ACCOUNT_FILE: /run/secrets/pairdesk-fcm-service-account.json
    volumes:
      - pairdesk-data:/data
      - ${PAIRDESK_APNS_PRIVATE_KEY_HOST_FILE:-/dev/null}:/run/secrets/pairdesk-apns-auth-key:ro
      - ${PAIRDESK_FCM_SERVICE_ACCOUNT_HOST_FILE:-/dev/null}:/run/secrets/pairdesk-fcm-service-account.json:ro
      - ${PAIRDESK_RESEND_API_KEY_HOST_FILE:-/dev/null}:/run/secrets/pairdesk-resend-key:ro
    restart: unless-stopped
    depends_on: [livekit]
volumes:
  pairdesk-data:
