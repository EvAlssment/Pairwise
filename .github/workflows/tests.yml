name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pairdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pairdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Shared-storage concurrency tests
        working-directory: server
        env:
          PAIRDESK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pairdesk_test?sslmode=disable
        run: go test -race ./internal/app -run 'TestPostgres' -count=1

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache-dependency-path: server/go.sum
      - name: Native macOS tests
        working-directory: macos
        run: swift test -j 4
      - name: Build pinned LiveKit test server
        run: GOBIN="$RUNNER_TEMP/livekit-bin" go install github.com/livekit/livekit-server/cmd/server@v1.8.4
      - name: App call and media end-to-end tests
        env:
          PAIRDESK_TEST_MEDIA_URL: ws://127.0.0.1:7880
          PAIRDESK_TEST_MEDIA_API_URL: http://127.0.0.1:7880
          PAIRDESK_MEDIA_BENCHMARK_OUTPUT: ${{ github.workspace }}/media-benchmark-output/pairwise-media-benchmark.json
          PAIRDESK_NETWORK_CONDITION_REPORT: ${{ github.workspace }}/media-benchmark-output/network-conditioner.json
          PAIRDESK_BENCHMARK_COMMIT: ${{ github.sha }}
          PAIRDESK_BENCHMARK_RUN_ID: ${{ github.run_id }}
          PAIRDESK_TEST_FILTER: CallIntegrationTests/testOneToOneSyntheticScreenQualityProfile|CallIntegrationTests/testFourNativeClientsCameraPublicationAndExclusiveScreenPermission|HostCursorIntegrationTests/testSharerRelaysAnIndependentViewerCursorToOtherParticipants|HostCursorIntegrationTests/testAuthenticatedCursorPacketsShowNamesOnHostAndClearWithTheShare
        run: |
          set -eu
          NODE_INTERFACE=$(route -n get default | awk '/interface:/{print $2; exit}')
          NODE_IP=$(ipconfig getifaddr "$NODE_INTERFACE")
          test -n "$NODE_IP"
          PAIRDESK_LIVEKIT_NODE_IP="$NODE_IP" sh infra/setup.sh
          "$RUNNER_TEMP/livekit-bin/server" --config infra/livekit.yaml > "$RUNNER_TEMP/livekit.log" 2>&1 &
          MEDIA_PID=$!
          trap 'kill "$MEDIA_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7880 > /dev/null; then break; fi
            sleep 1
          done
          PAIRDESK_BENCHMARK_PROFILE=baseline sh scripts/test-call.sh
          # Camera publication is verified above without impairment. Keep the
          # constrained profile focused on screen quality and cursor behavior;
          # camera frame delivery under 1% packet loss is nondeterministic on CI.
          PAIRDESK_SKIP_CAMERA_PUBLICATION_TEST=1 sh scripts/with-macos-network-condition.sh sh scripts/test-call.sh
      - name: Validate synthetic media benchmark
        if: always()
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          test -s media-benchmark-output/pairwise-media-benchmark-baseline-2p.json
          test -s media-benchmark-output/pairwise-media-benchmark-baseline-4p.json
          test -s media-benchmark-output/pairwise-media-benchmark-constrained-2p.json
          test -s media-benchmark-output/pairwise-media-benchmark-constrained-4p.json
          test -s media-benchmark-output/pairwise-cursor-benchmark-baseline-2p.json
          test -s media-benchmark-output/pairwise-cursor-benchmark-baseline-3p.json
          test -s media-benchmark-output/pairwise-cursor-benchmark-constrained-2p.json
          test -s media-benchmark-output/pairwise-cursor-benchmark-constrained-3p.json
          python3 scripts/validate-media-benchmark.py \
            media-benchmark-output/pairwise-media-benchmark-baseline-2p.json \
            media-benchmark-output/pairwise-media-benchmark-baseline-4p.json \
            media-benchmark-output/pairwise-media-benchmark-constrained-2p.json \
            media-benchmark-output/pairwise-media-benchmark-constrained-4p.json \
            --cursor-reports \
            media-benchmark-output/pairwise-cursor-benchmark-baseline-2p.json \
            media-benchmark-output/pairwise-cursor-benchmark-baseline-3p.json \
            media-benchmark-output/pairwise-cursor-benchmark-constrained-2p.json \
            media-benchmark-output/pairwise-cursor-benchmark-constrained-3p.json \
            --conditioner media-benchmark-output/network-conditioner.json
      - name: Archive synthetic media benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-quality-${{ github.sha }}-${{ github.run_id }}
          path: media-benchmark-output/*.json
          if-no-files-found: error
      - name: Server race tests and vet
        working-directory: server
        run: go test -race ./... && go vet ./...
