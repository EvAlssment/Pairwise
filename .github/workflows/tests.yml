name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - name: Install Android build platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run Android unit tests and assemble release APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

  api-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke test API image with commit metadata
        env:
          PAIRDESK_BUILD_COMMIT: ${{ github.sha }}
        run: bash scripts/ci-api-image.sh
      - name: Test release tag ancestry validation
        run: python3 -m unittest discover -s scripts/tests -p 'test_validate_release_tag.py'
      - name: Test production API deploy and rollback logic
        run: python3 -m unittest discover -s scripts/tests -p 'test_manage_deploy_api.py'
      - name: Test signup configuration preservation
        run: python3 -m unittest discover -s scripts/tests -p 'test_signup_config.py'

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test iOS call and session recovery model
        run: sh scripts/test-ios-model.sh
      - name: Build iOS simulator app without signing
        run: >-
          xcodebuild -quiet
          -project mobile/ios/PairDesk.xcodeproj
          -scheme PairDesk
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pairdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pairdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Shared-storage concurrency tests
        working-directory: server
        env:
          PAIRDESK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pairdesk_test?sslmode=disable
        run: go test -race ./internal/app -run 'TestPostgres' -count=1

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache-dependency-path: server/go.sum
      - name: Shared approval state tests
        run: swift test --package-path shared -j 4
      - name: Native macOS tests
        working-directory: macos
        run: swift test -j 4
      - name: Cross-compile universal macOS executables
        run: sh scripts/ci-universal-macos-build.sh
      - name: Run media quality regression gate
        env:
          PAIRDESK_MEDIA_BENCHMARK_DIR: ${{ github.workspace }}/media-benchmark-output
          PAIRDESK_BENCHMARK_COMMIT: ${{ github.sha }}
          PAIRDESK_BENCHMARK_RUN_ID: ${{ github.run_id }}
        run: sh scripts/ci-media-quality.sh
      - name: Validate synthetic media benchmark
        if: always()
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          test -s media-benchmark-output/pairwise-media-benchmark-baseline-2p.json
          test -s media-benchmark-output/pairwise-media-benchmark-baseline-4p.json
          test -s media-benchmark-output/pairwise-media-benchmark-constrained-2p.json
          test -s media-benchmark-output/pairwise-media-benchmark-constrained-4p.json
          test -s media-benchmark-output/pairwise-cursor-benchmark-baseline-2p.json
          test -s media-benchmark-output/pairwise-cursor-benchmark-baseline-3p.json
          test -s media-benchmark-output/pairwise-cursor-benchmark-constrained-2p.json
          test -s media-benchmark-output/pairwise-cursor-benchmark-constrained-3p.json
          python3 scripts/validate-media-benchmark.py \
            media-benchmark-output/pairwise-media-benchmark-baseline-2p.json \
            media-benchmark-output/pairwise-media-benchmark-baseline-4p.json \
            media-benchmark-output/pairwise-media-benchmark-constrained-2p.json \
            media-benchmark-output/pairwise-media-benchmark-constrained-4p.json \
            --cursor-reports \
            media-benchmark-output/pairwise-cursor-benchmark-baseline-2p.json \
            media-benchmark-output/pairwise-cursor-benchmark-baseline-3p.json \
            media-benchmark-output/pairwise-cursor-benchmark-constrained-2p.json \
            media-benchmark-output/pairwise-cursor-benchmark-constrained-3p.json \
            --conditioner media-benchmark-output/network-conditioner.json
      - name: Archive synthetic media benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-quality-${{ github.sha }}-${{ github.run_id }}
          path: media-benchmark-output/*.json
          if-no-files-found: error
      - name: Server race tests and vet
        working-directory: server
        run: go test -race ./... && go vet ./...
